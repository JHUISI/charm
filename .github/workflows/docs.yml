name: Build and Deploy Docs

on:
  push:
    branches: [main, dev, explore/pip-charm-crypto]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libssl-dev flex bison libfl-dev

    - name: Build and install PBC library
      run: |
        wget https://crypto.stanford.edu/pbc/files/pbc-1.0.0.tar.gz
        tar -xzf pbc-1.0.0.tar.gz
        cd pbc-1.0.0
        ./configure
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Configure charm-crypto
      run: ./configure.sh

    - name: Build C extensions
      run: |
        pip install --upgrade pip setuptools wheel
        python setup.py build_ext --inplace

    - name: Install Python dependencies
      run: |
        pip install pyparsing sphinx furo

    - name: Build documentation
      run: |
        cd doc
        # Build docs - ignore segfault during cleanup if HTML was generated
        make html || {
          if [ -f build/html/index.html ]; then
            echo "Docs built successfully (segfault during cleanup is a known issue)"
          else
            echo "Docs build failed"
            exit 1
          fi
        }
      env:
        LD_LIBRARY_PATH: /usr/local/lib

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./doc/build/html
        publish_branch: gh-pages
        force_orphan: true
